<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | SideQuest Co</title>
    <link href="dist/styles.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
    <style> body { font-family: 'Marcellus', sans-serif; } </style>
</head>
<body class="bg-white min-h-screen">
    <header class="py-6 mb-8 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <a href="/"><img src="images/invert1.png" alt="SideQuest Co" class="h-20 mx-auto"></a>
        </div>
    </header>
    <main class="max-w-xl mx-auto px-4 text-center pb-16">
        <h1 class="text-3xl font-light text-primary mb-4">Thank you for your order! 🎉</h1>
        <p class="text-secondary mb-2">Your payment was received. A receipt has been emailed to you by Stripe.</p>
        <p class="text-secondary mb-8">We print and pack every order ourselves in Canada — you'll get a shipping confirmation with tracking within a few business days.</p>
        <a href="shop.html" class="inline-block bg-primary text-white px-8 py-3 text-sm font-medium hover:bg-opacity-90 transition-colors duration-300">Back to the shop</a>
    </main>
    <script src="js/store.js"></script>
    <script>
        // Payment completed — clear the cart.
        try { localStorage.removeItem('sqc_cart_v1'); } catch (e) {}
    </script>
</body>
</html>
