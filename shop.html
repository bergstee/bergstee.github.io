<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | SideQuest Co</title>
    <link href="dist/styles.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Marcellus', sans-serif; }
        select { border: 1px solid #e5e7eb; padding: 0.35rem 0.5rem; font-size: 0.85rem; width: 100%; background: #fff; }
        .ctry-btn { border: 1px solid #e5e7eb; padding: 0.25rem 0.6rem; font-size: 0.75rem; }
        .ctry-btn.active { background: #111; color: #fff; border-color: #111; }
    </style>
</head>
<body class="bg-white min-h-screen">
    <header class="py-6 mb-8 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center">
                <a href="/"><img src="images/invert1.png" alt="SideQuest Co" class="h-20"></a>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-1">
                        <button class="ctry-btn" data-country="CA">🇨🇦 CAD</button>
                        <button class="ctry-btn" data-country="US">🇺🇸 USD</button>
                    </div>
                    <a href="cart.html" class="text-sm font-medium text-primary hover:text-opacity-80">Cart <span id="cart-count"></span></a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">
        <h1 class="text-3xl font-light text-primary mb-2">Shop</h1>
        <p class="text-secondary mb-2 text-sm">3D printed bookish decor — designed and printed in Canada.</p>
        <p id="ship-note" class="text-xs text-secondary mb-8"></p>
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p id="loading" class="text-secondary col-span-full">Loading products…</p>
        </div>
    </main>

    <script src="js/store.js"></script>
    <script>
        function esc(s) {
            const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
        }

        let COUNTRY = getCountry();
        let PRODUCTS = [];

        function paintCountryButtons() {
            document.querySelectorAll('.ctry-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.country === COUNTRY);
            });
            document.getElementById('ship-note').textContent = COUNTRY === 'US'
                ? 'Shipping to the US: $16 USD first item, $2.50 each additional. Duties are prepaid — nothing owed on delivery.'
                : 'Shipping across Canada: $14 CAD first item, $2.50 each additional. Taxes calculated at checkout.';
        }

        function selectionFor(card) {
            const sel = {};
            card.querySelectorAll('select[data-varname]').forEach(s => { sel[s.dataset.varname] = s.value; });
            return sel;
        }

        function refreshCardPrice(card, product) {
            const sel = selectionFor(card);
            const priceEl = card.querySelector('[data-price]');
            const btn = card.querySelector('[data-add]');
            const price = variantPrice(product, sel);
            const inStock = variantInStock(product, sel);
            priceEl.textContent = money(price, COUNTRY);
            btn.disabled = !inStock;
            btn.textContent = inStock ? 'Add to cart' : 'Sold out';
            btn.style.opacity = inStock ? '1' : '0.5';
        }

        function render(data) {
            COUNTRY = data.country;
            PRODUCTS = data.products;
            paintCountryButtons();
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            data.products.forEach((p, idx) => {
                const card = document.createElement('div');
                card.className = 'flex flex-col border border-gray-100 hover:shadow-md transition-shadow duration-300';
                card.dataset.idx = idx;
                const varSelects = (p.properties || []).map(prop => `
                    <label class="block text-xs text-secondary mt-2">${esc(prop.name)}
                        <select data-varname="${esc(prop.name)}">
                            ${prop.values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('')}
                        </select>
                    </label>`).join('');
                card.innerHTML = `
                    <div class="aspect-square bg-gray-50 overflow-hidden">
                        ${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.title)}" loading="lazy" class="w-full h-full object-cover">` : ''}
                    </div>
                    <div class="p-4 flex flex-col flex-1">
                        <h2 class="text-sm text-primary flex-1">${esc(p.title)}</h2>
                        <p class="text-primary font-medium mt-2" data-price>${money(p.price, COUNTRY)}</p>
                        ${varSelects}
                        <button class="mt-3 bg-primary text-white py-2 text-sm hover:bg-opacity-90 transition-colors duration-300" data-add="${idx}">
                            Add to cart
                        </button>
                    </div>`;
                grid.appendChild(card);
                if ((p.properties || []).length) refreshCardPrice(card, p);
            });
        }

        function load() {
            document.getElementById('products-grid').innerHTML = '<p class="text-secondary col-span-full">Loading products…</p>';
            fetchProducts(COUNTRY).then(render).catch(err => {
                document.getElementById('products-grid').innerHTML =
                    '<p class="text-secondary col-span-full">The shop is temporarily unavailable — please try again shortly.</p>';
                console.error(err);
            });
        }

        document.querySelectorAll('.ctry-btn').forEach(b => {
            b.addEventListener('click', () => {
                if (b.dataset.country === COUNTRY) return;
                COUNTRY = b.dataset.country;
                setCountry(COUNTRY);      // clears the cart: prices are currency-specific
                updateCartBadge();
                load();
            });
        });

        const grid = document.getElementById('products-grid');
        grid.addEventListener('change', e => {
            const card = e.target.closest('[data-idx]');
            if (card && e.target.matches('select[data-varname]')) {
                refreshCardPrice(card, PRODUCTS[parseInt(card.dataset.idx, 10)]);
            }
        });
        grid.addEventListener('click', e => {
            const btn = e.target.closest('[data-add]');
            if (!btn || btn.disabled) return;
            const card = btn.closest('[data-idx]');
            const p = PRODUCTS[parseInt(card.dataset.idx, 10)];
            const chosen = selectionFor(card);
            addToCart(p, 1, chosen, variantPrice(p, chosen));
            btn.textContent = 'Added ✓';
            setTimeout(() => { btn.textContent = 'Add to cart'; }, 1200);
        });

        paintCountryButtons();
        load();
    </script>
</body>
</html>
