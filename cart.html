<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your cart | SideQuest Co</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link href="css/storefront.css?v=202608251230" rel="stylesheet">
</head>
<body>

<div class="announce">Every piece printed &amp; hand-finished in our Canadian studio · shipping calculated at checkout</div>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="/"><img class="header-logo" src="images/invert1.png" alt="SideQuest Co"></a>
    <nav class="site-nav"><a href="shop.html">Shop</a></nav>
    <div class="spacer"></div>
    <div class="ccy" title="US prices include prepaid duty, so there is nothing extra to pay on delivery">
      <button data-ccy="CA">CAD</button>
      <button data-ccy="US">USD</button>
    </div>
    <a href="cart.html">Cart<span class="muted" data-cart-count></span></a>
  </div>
  <div class="duty-note" data-duty-note hidden>US prices include prepaid duty, so there is nothing to pay on delivery.</div>
</header>

<main class="wrap" style="max-width:960px;padding-top:52px;padding-bottom:88px">
  <h1 class="page-title" style="margin:0 0 34px;font-size:34px;font-weight:400">Your cart</h1>
  <div data-cart></div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div style="display:flex;flex-direction:column;gap:8px">
      <img src="images/invert1.png" alt="SideQuest Co" style="height:38px;width:fit-content">
      <p class="prose muted" style="margin:0;font-size:15px">3D printed &amp; hand-finished in Canada, one layer at a time.</p>
    </div>
    <div class="footer-links">
      <a href="/">Home</a>
      <a href="shop.html">Shop</a>
      <span class="muted">sidequestco.ca</span>
    </div>
  </div>
</footer>

<script src="js/storefront.js?v=202608251230"></script>
<script>
(() => {
    const country = getCountry();
    const host = document.querySelector('[data-cart]');

    function paint() {
        const cart = loadCart();
        if (!cart.length) {
            host.innerHTML = `
              <div class="empty">
                <p style="margin:0 0 8px;font-size:20px">Your shelf is waiting.</p>
                <p class="prose muted" style="margin:0 0 26px;font-size:17px">Nothing here yet. Go find your next small delight.</p>
                <a class="btn" href="shop.html">Browse the shop</a>
              </div>`;
            return;
        }
        const subtotal = cart.reduce((t, l) => t + l.price * l.quantity, 0);
        host.innerHTML = `
          <div>
            ${cart.map(l => {
                const vars = Object.entries(l.variations || {}).map(([k, v]) => `${k}: ${v}`).join(' · ') || 'Standard';
                return `
                <div class="cart-row">
                  <img src="${esc(l.image_url || '')}" alt="${esc(l.title)}">
                  <div class="cart-meta">
                    <a href="item.html?id=${encodeURIComponent(l.listing_id)}" style="font-size:15px;line-height:1.4">${esc(l.title)}</a>
                    <span class="muted" style="font-size:12.5px">${esc(vars)}</span>
                    <a href="#" class="link-quiet" data-remove="${esc(l.key)}" style="width:fit-content">Remove</a>
                  </div>
                  <div class="qty">
                    <button data-dec="${esc(l.key)}" aria-label="Decrease quantity">−</button>
                    <span>${l.quantity}</span>
                    <button data-inc="${esc(l.key)}" aria-label="Increase quantity">+</button>
                  </div>
                  <span class="cart-line">${money(l.price * l.quantity, country)}</span>
                </div>`;
            }).join('')}
          </div>
          <div class="cart-summary">
            <div class="cart-summary-inner">
              <div class="cart-total"><span>Subtotal</span><span>${money(subtotal, country)}</span></div>
              <p class="muted" style="margin:0;font-size:12.5px;line-height:1.55">
                Shipping and taxes are calculated at checkout. Checkout is securely handled by Stripe.
                ${country === 'US' ? 'Duty on US orders is prepaid, so there is nothing to pay on delivery.' : ''}
              </p>
              <button class="btn" data-checkout>Continue to checkout</button>
              <a href="shop.html" class="muted" style="font-size:13px;text-align:center">← Keep browsing</a>
            </div>
          </div>`;
    }

    host.addEventListener('click', (e) => {
        const dec = e.target.closest('[data-dec]');
        const inc = e.target.closest('[data-inc]');
        const rm = e.target.closest('[data-remove]');
        const co = e.target.closest('[data-checkout]');
        if (dec || inc) {
            const el = dec || inc;
            const key = el.dataset.dec || el.dataset.inc;
            const line = loadCart().find(l => l.key === key);
            if (line) setQuantity(key, line.quantity + (dec ? -1 : 1));
            paint();
        } else if (rm) {
            e.preventDefault();
            removeLine(rm.dataset.remove);
            paint();
        } else if (co) {
            startCheckout(co);
        }
    });

    paint();
})();
</script>
</body>
</html>
