<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | SideQuest Co</title>
    <link href="dist/styles.css?v=202608251045" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Marcellus', sans-serif; }
        .qty-btn { width: 1.75rem; height: 1.75rem; border: 1px solid #e5e7eb; }
    </style>
</head>
<body class="bg-white min-h-screen">
    <header class="py-6 mb-8 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center gap-2">
                <a href="/"><img src="images/invert1.png" alt="SideQuest Co" class="h-12 sm:h-20"></a>
                <a href="shop.html" class="text-sm font-medium text-primary hover:text-opacity-80">← Continue shopping</a>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">
        <h1 class="text-3xl font-light text-primary mb-8">Your Cart</h1>
        <div id="cart-lines" class="divide-y divide-gray-100"></div>

        <div id="cart-summary" class="mt-8 hidden">
            <div class="flex justify-between text-primary text-lg mb-1">
                <span>Subtotal</span><span id="cart-subtotal"></span>
            </div>
            <p class="text-xs text-secondary mb-6">Shipping &amp; any applicable tax are calculated at checkout.</p>

            <p id="ship-to" class="text-sm text-primary mb-1"></p>
            <p class="text-xs text-secondary mb-6">Prices and shipping are shown for your destination. To change it, use the currency switch on the <a href="shop.html" class="underline">shop page</a>.</p>

            <button id="checkout-btn" class="w-full bg-primary text-white py-3 text-sm font-medium hover:bg-opacity-90 transition-colors duration-300">
                Checkout
            </button>
            <p id="pay-note" class="text-xs text-secondary mt-3 text-center"></p>
        </div>
        <p id="cart-empty" class="text-secondary hidden">Your cart is empty. <a href="shop.html" class="underline">Browse the shop →</a></p>
    </main>

    <script src="js/store.js?v=202608251045"></script>
    <script>
        function esc(s) {
            const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
        }

        function render() {
            const cart = loadCart();
            const linesEl = document.getElementById('cart-lines');
            const empty = document.getElementById('cart-empty');
            const summary = document.getElementById('cart-summary');
            linesEl.innerHTML = '';
            if (cart.length === 0) {
                empty.classList.remove('hidden');
                summary.classList.add('hidden');
                return;
            }
            empty.classList.add('hidden');
            summary.classList.remove('hidden');
            let subtotal = 0;
            cart.forEach(l => {
                subtotal += l.price * l.quantity;
                const varText = Object.entries(l.variations || {}).map(([k, v]) => `${k}: ${v}`).join(', ');
                const row = document.createElement('div');
                row.className = 'py-4 flex gap-4 items-center';
                row.innerHTML = `
                    <div class="w-16 h-16 bg-gray-50 flex-shrink-0 overflow-hidden">
                        ${l.image_url ? `<img src="${esc(l.image_url)}" class="w-full h-full object-cover" alt="">` : ''}
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm text-primary truncate">${esc(l.title)}</p>
                        ${varText ? `<p class="text-xs text-secondary">${esc(varText)}</p>` : ''}
                        <p class="text-sm text-primary mt-1">${money(l.price, getCountry())}</p>
                    </div>
                    <div class="flex items-center gap-1">
                        <button class="qty-btn" data-dec="${esc(l.key)}">−</button>
                        <span class="w-8 text-center text-sm">${l.quantity}</span>
                        <button class="qty-btn" data-inc="${esc(l.key)}">+</button>
                    </div>`;
                linesEl.appendChild(row);
            });
            const c = getCountry();
            document.getElementById('cart-subtotal').textContent = money(subtotal, c);
            document.getElementById('ship-to').textContent = c === 'US'
                ? 'Shipping to the United States — duties prepaid, nothing owed on delivery.'
                : 'Shipping within Canada — taxes calculated at checkout.';
            document.getElementById('pay-note').textContent =
                `Secure payment via Stripe. Prices in ${currencyLabel(c)}.`;
        }

        document.getElementById('cart-lines').addEventListener('click', e => {
            const dec = e.target.closest('[data-dec]');
            const inc = e.target.closest('[data-inc]');
            const cart = loadCart();
            if (dec) {
                const l = cart.find(x => x.key === dec.dataset.dec);
                if (l) setQuantity(l.key, l.quantity - 1);
            } else if (inc) {
                const l = cart.find(x => x.key === inc.dataset.inc);
                if (l) setQuantity(l.key, l.quantity + 1);
            } else return;
            render();
        });

        document.getElementById('checkout-btn').addEventListener('click', () => {
            startCheckout(getCountry());
        });

        render();
    </script>
</body>
</html>
